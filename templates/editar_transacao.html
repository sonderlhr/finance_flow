{% extends "base.html" %}

{% block title %}Editar Transação | FinanceFlow{% endblock %}

{% block content %}
    <h1>Editar Transação</h1>

    <form method="POST">
        <label for="descricao">Descrição:</label><br>
        <input type="text" id="descricao" name="descricao" value="{{ transacao.descricao }}" required>
        <br><br>

        <label for="valor">Valor (R$):</label><br>
        <input type="text" id="valor" name="valor" value="{{ '%.2f'|format(transacao.valor) }}" required>
        <br><br>

        <label for="tipo">Tipo:</label><br>
        <select id="tipo" name="tipo" required>
            <option value="receita" {% if transacao.tipo == "receita" %}selected{% endif %}>Receita</option>
            <option value="despesa" {% if transacao.tipo == "despesa" %}selected{% endif %}>Despesa</option>
        </select>
        <br><br>

        <label for="data">Data:</label><br>
        <input type="date" id="data" name="data" value="{{ transacao.data.strftime('%Y-%m-%d') }}" required>
        <br><br>

        <label for="conta_id">Conta:</label><br>
        <select id="conta_id" name="conta_id" required>
            {% for conta in contas %}
                <option value="{{ conta.id }}" {% if conta.id == transacao.conta_id %}selected{% endif %}>{{ conta.nome }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label for="categoria_id">Categoria:</label><br>
        <select id="categoria_id" name="categoria_id" required>
            {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if categoria.id == transacao.categoria_id %}selected{% endif %}>{{ categoria.nome }}</option>
            {% endfor %}
        </select>
        <br><br>

        <button type="submit">Salvar Alterações</button>
        <a href="{{ url_for('financeiro.transacoes') }}">Cancelar</a>
    </form>
{% endblock %}
